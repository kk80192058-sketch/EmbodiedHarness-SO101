name: Bug report
description: Report a reproducible software, documentation, simulation, or CI defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not use a public issue for a vulnerability that could move hardware
        unsafely or bypass a safety gate. Follow SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest command, inputs, and environment needed to reproduce the issue. Never paste credentials or private raw captures.
      placeholder: |
        1. Install …
        2. Run …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, package versions, and whether this was simulation, saved evidence, or connected hardware.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or evidence
      description: Redact secrets. Link to a minimal public artifact only when it is safe to share.
    validations:
      required: false
